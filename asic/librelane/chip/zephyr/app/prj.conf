# Zephyr in User mode on asic_soc_rv32imac: threads isolated by the PMP (memory domains)
CONFIG_USERSPACE=y
CONFIG_RISCV_PMP=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n
CONFIG_LOG=n
CONFIG_THREAD_NAME=n
CONFIG_MINIMAL_LIBC=y
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_INIT_STACKS=n
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=512
CONFIG_PRIVILEGED_STACK_SIZE=512
CONFIG_TIMER_RANDOM_GENERATOR=n
CONFIG_ENTROPY_GENERATOR=n
CONFIG_TEST_RANDOM_GENERATOR=n
