description: CORE-V-Wally I2C master (src/uncore/mcu/i2c_apb.sv)

compatible: "wally,i2c"

include: [i2c-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    description: |
      The controller's interrupt (PLIC source 17).  With it the driver sleeps while a command runs; without it,
      it polls.
