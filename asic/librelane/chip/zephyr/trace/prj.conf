# The chip's instruction trace (E-Trace, docs/trace.md) switched on by Zephyr itself, around a workload with two
# threads and a timer interrupt
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=n
CONFIG_LOG=n
CONFIG_THREAD_NAME=n
CONFIG_MINIMAL_LIBC=y
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_INIT_STACKS=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=1024
CONFIG_TIMER_RANDOM_GENERATOR=n
CONFIG_ENTROPY_GENERATOR=n
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_SERIAL=y
