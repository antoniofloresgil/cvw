# OpenOCD for Wally's DTM in BSCAN mode (DEBUG_BSCAN, src/debug/dtm.sv): the DTM's dtmcs and dmi are the
# USER3 and USER4 registers of the FPGA's own TAP (6-bit IR).  In simulation (make openocd BSCAN=1) the TAP is
# testbench/debug/xilinx_tap.sv through remote_bitbang; on the Nexys Video, fpga/openocd-nexysvideo.cfg uses
# the same lines after the board's FT2232 adapter.

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9823
adapter speed 1000
transport select jtag

jtag newtap xc7 tap -irlen 6 -expected-id 0x13636093
target create wally.cpu riscv -chain-position xc7.tap
riscv set_ir idcode 0x09
riscv set_ir dtmcs 0x22
riscv set_ir dmi 0x23
