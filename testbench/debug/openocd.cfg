# OpenOCD configuration for Wally's JTAG debug port (src/debug) in simulation: openocd_tb
# serves remote_bitbang on port 9823.  On a board, replace the adapter lines with the
# adapter's (for example "source [find interface/ftdi/c232hm.cfg]").
#
# The hart cannot halt yet (no debug mode in the core), so the target is not examined:
# use "riscv dmi_read" and "riscv dmi_write" (System Bus Access, hartreset, ndmreset), as
# openocd_test.tcl does.

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9823
adapter speed 1000
transport select jtag

jtag newtap wally cpu -irlen 5 -expected-id 0x00000001
target create wally.cpu riscv -chain-position wally.cpu -defer-examine
