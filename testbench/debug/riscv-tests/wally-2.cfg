# OpenOCD configuration for riscv-tests/debug on Wally with two harts (NHARTS=2), after the
# suite's spike-2.cfg: one TAP, one target per hart (-coreid), and the work area of wally.cfg.
adapter speed     10000

adapter driver remote_bitbang
remote_bitbang host $::env(REMOTE_BITBANG_HOST)
remote_bitbang port $::env(REMOTE_BITBANG_PORT)

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001

set _TARGETNAME_0 $_CHIPNAME.cpu0
set _TARGETNAME_1 $_CHIPNAME.cpu1
target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -coreid 0
target create $_TARGETNAME_1 riscv -chain-position $_CHIPNAME.cpu -coreid 1

gdb_report_data_abort enable
gdb_report_register_access_error enable

# Expose an unimplemented CSR so we can test non-existent register access behavior.
foreach t [target names] {
    targets $t
    $t configure -work-area-phys $::env(WORK_AREA) -work-area-size 8096 -work-area-backup 1
    riscv expose_csrs 2288
}

init

foreach t [target names] {
    targets $t
    halt
    arm semihosting enable
}
