# OpenOCD 0.12 for Wally's JTAG debug port on the Nexys Video (config fpganexysvideodbg): through the board's USB
# programming port (the FT2232's channel B, as openFPGALoader -b nexysVideo uses it) and the FPGA's own TAP, whose
# USER3 and USER4 registers are the DTM's dtmcs and dmi (BSCANE2, fpga/src/fpgaTopNexysA7.sv; src/debug/dtm.sv, BSCAN).
# Load the bitstream first (openFPGALoader holds the same port: let it finish).  docs/fpga-debug.md

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 1
ftdi layout_init 0x00e8 0x60eb
adapter speed 10000
transport select jtag

jtag newtap xc7 tap -irlen 6 -expected-id 0x13636093
target create wally.cpu riscv -chain-position xc7.tap
riscv set_ir idcode 0x09
riscv set_ir dtmcs 0x22
riscv set_ir dmi 0x23
